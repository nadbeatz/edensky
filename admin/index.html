<!doctype html>
<html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102f37"><title>Administração | Eden Sky</title><style>
:root{color-scheme:light;--ink:#142d35;--muted:#64757b;--cyan:#07bdc6;--blue:#277e92;--line:#dfe9eb;--paper:#f3f8f9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}.shell{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-weight:900;font-size:1.3rem;letter-spacing:-.04em}.brand span{color:var(--blue)}.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 14px 40px #1446500c}.login{max-width:430px;margin:10vh auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin:12px 0}.field.full{grid-column:1/-1}label{font-size:.86rem;font-weight:750}input,textarea,select{width:100%;padding:12px;border:1px solid #ccdadd;border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:150px;resize:vertical}.btn{border:0;border-radius:999px;padding:11px 18px;background:linear-gradient(110deg,#07bdc6,#62cdcf,#277e92);color:#07363b;font-weight:850;cursor:pointer}.btn.secondary{background:#edf5f6;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#9b2525;border:1px solid #f2cccc}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer}.tab.active{background:#e2f8f8;border-color:#9adfe0;color:#176d78}.rowitem{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.rowitem:last-child{border:0}.rowitem h3{font-size:1rem;margin:0}.pill{font-size:.75rem;font-weight:800;border-radius:99px;padding:4px 9px;background:#edf5f6;color:#41616a}.status{min-height:24px;margin-top:12px;color:#176d78;font-weight:700}.hidden{display:none!important}.hint{font-size:.82rem;color:var(--muted)}.thumb{width:76px;height:54px;object-fit:cover;border-radius:8px;background:#eaf1f2}.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.editor{margin-top:20px}.editor h2{margin-top:0}@media(max-width:650px){.shell{padding:14px}.panel{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start}.rowitem{align-items:flex-start}.rowitem .actions{margin:0}.rowitem .actions button{padding:8px 11px}}
</style></head><body><main class="shell">
<header class="top"><div><div class="brand">EDEN <span>SKY</span> / CMS</div><div class="muted">Painel de gestão de conteúdos</div></div><button id="logout" class="btn secondary hidden">Terminar sessão</button></header>
<section id="login" class="panel login"><h1>Área reservada</h1><p class="muted">Aceda com a conta de administrador da Eden Sky.</p><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required value="djnadinho48@gmail.com"></div><div class="field"><label for="password">Palavra-passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entrar no painel</button></form><div id="loginStatus" class="status" role="status"></div></section>
<section id="app" class="hidden"><div class="tabs"><button class="tab active" data-tab="news">Notícias</button><button class="tab" data-tab="portfolio">Portefólio</button></div><div class="panel"><div class="listhead"><div><h1 id="sectionTitle">Notícias</h1><p class="muted">Crie, edite e publique conteúdos no website.</p></div><button id="newItem" class="btn">+ Novo conteúdo</button></div><div id="items"></div><div id="editor" class="editor hidden"><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2 id="editorTitle">Novo conteúdo</h2><form id="contentForm"><input id="itemId" type="hidden"><div class="grid"><div class="field full"><label for="title">Título</label><input id="title" required maxlength="180"></div><div class="field full" id="slugField"><label for="slug">Endereço (slug)</label><input id="slug" placeholder="titulo-da-noticia"></div><div class="field full"><label for="description">Resumo / descrição</label><textarea id="description"></textarea></div><div class="field full" id="bodyField"><label for="body">Conteúdo da notícia</label><textarea id="body" required></textarea></div><div class="field full" id="youtubeField"><label for="youtube">Link do YouTube</label><input id="youtube" type="url" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field full"><label for="image">Imagem de capa / miniatura</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><div class="hint">JPG, PNG ou WebP. Máximo 5 MB.</div><input id="imageUrl" type="url" placeholder="URL da imagem (opcional)"></div><div class="field" id="statusField"><label for="status">Estado</label><select id="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select></div><div class="field" id="publishedField"><label for="published">Visibilidade</label><select id="published"><option value="true">Publicado</option><option value="false">Oculto</option></select></div><div class="field" id="orderField"><label for="sort">Ordem</label><input id="sort" type="number" value="0"></div></div><div class="actions"><button class="btn" type="submit">Guardar conteúdo</button><button class="btn secondary" type="button" id="cancel">Cancelar</button></div><div id="formStatus" class="status" role="status"></div></form></div></div></section>
</main><script>
(()=>{'use strict';
const API='https://cjifbflilsbkmwuqkmtw.supabase.co',KEY='sb_publishable_c0fetT7Bqy-jraIwzZID4w_ihIetFH0',BUCKET='eden-media';
let session=null,section='news',rows=[];
const $=id=>document.getElementById(id);
const headers=()=>({'apikey':KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'});
async function request(path,opts={}){const res=await fetch(API+path,{...opts,headers:{...headers(),...(opts.headers||{})}});const txt=await res.text();let data=null;try{data=txt?JSON.parse(txt):null}catch{}if(!res.ok)throw new Error(data?.message||data?.error_description||txt||'Erro no pedido ('+res.status+')');return data}
async function login(email,password){const res=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await res.json();if(!res.ok)throw new Error(data.msg||data.message||'Credenciais inválidas.');session=data;const user=await request('/auth/v1/user');if(user.app_metadata?.role!=='admin'){session=null;throw new Error('Esta conta não tem permissões de administrador.');}localStorage.setItem('eden_cms_session',JSON.stringify(session));showApp();await loadItems()}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden')}
async function restore(){try{const raw=localStorage.getItem('eden_cms_session');if(!raw)return;session=JSON.parse(raw);if(session.expires_at*1000<Date.now()+60000){const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});const d=await r.json();if(!r.ok)throw Error('Sessão expirada');session=d;localStorage.setItem('eden_cms_session',JSON.stringify(session));}const u=await request('/auth/v1/user');if(u.app_metadata?.role!=='admin')throw Error('Sem permissão');showApp();await loadItems()}catch(e){session=null;localStorage.removeItem('eden_cms_session')}}
async function loadItems(){const path=section==='news'?'/rest/v1/news?select=*&order=created_at.desc':'/rest/v1/portfolio_items?select=*&order=sort_order.asc,created_at.desc';rows=await request(path);render()}
function render(){const box=$('items');box.innerHTML='';if(!rows.length){box.innerHTML='<p class="muted">Ainda não existem conteúdos. Clique em “Novo conteúdo” para começar.</p>';return}rows.forEach(item=>{const div=document.createElement('div');div.className='rowitem';const left=document.createElement('div');left.style.display='flex';left.style.alignItems='center';left.style.gap='12px';if(item.cover_image_url||item.thumbnail_url){const img=document.createElement('img');img.className='thumb';img.src=item.cover_image_url||item.thumbnail_url;img.alt='';left.append(img)}const info=document.createElement('div');const h=document.createElement('h3');h.textContent=item.title;const p=document.createElement('div');p.className='hint';p.textContent=section==='news'?(item.status==='published'?'Publicado':'Rascunho'):(item.is_published?'Visível no site':'Oculto');info.append(h,p);left.append(info);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Editar';edit.onclick=()=>editItem(item);const del=document.createElement('button');del.className='btn danger';del.textContent='Eliminar';del.onclick=()=>deleteItem(item);actions.append(edit,del);div.append(left,actions);box.append(div)})}
function setMode(){const news=section==='news';$('sectionTitle').textContent=news?'Notícias':'Portefólio';$('slugField').classList.toggle('hidden',!news);$('bodyField').classList.toggle('hidden',!news);$('youtubeField').classList.toggle('hidden',news);$('statusField').classList.toggle('hidden',!news);$('publishedField').classList.toggle('hidden',news);$('orderField').classList.toggle('hidden',news)}
function openEditor(item=null){setMode();$('editor').classList.remove('hidden');$('editorTitle').textContent=item?'Editar conteúdo':'Novo conteúdo';$('itemId').value=item?.id||'';$('title').value=item?.title||'';$('slug').value=item?.slug||'';$('description').value=item?.excerpt??item?.description??'';$('body').value=item?.content||'';$('youtube').value=item?.youtube_url||'';$('imageUrl').value=item?.cover_image_url||item?.thumbnail_url||'';$('status').value=item?.status||'draft';$('published').value=String(item?.is_published??true);$('sort').value=item?.sort_order??0;$('image').value='';$('formStatus').textContent='';$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function editItem(item){openEditor(item)}
async function uploadImage(file){if(!file)return null;if(file.size>5*1024*1024)throw Error('A imagem ultrapassa 5 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Formato não permitido.');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=Date.now()+'-'+crypto.randomUUID()+'.'+ext;const res=await fetch(API+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});const d=await res.json();if(!res.ok)throw Error(d.message||'Falha no upload.');return API+'/storage/v1/object/public/'+BUCKET+'/'+path}
async function save(e){e.preventDefault();$('formStatus').textContent='A guardar…';try{const title=$('title').value.trim(),file=$('image').files[0],uploaded=await uploadImage(file),image=uploaded||$('imageUrl').value.trim()||null;let payload;if(section==='news'){const slug=$('slug').value.trim()||title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');payload={title,slug,excerpt:$('description').value.trim(),content:$('body').value.trim(),cover_image_url:image,status:$('status').value,published_at:$('status').value==='published'?new Date().toISOString():null}}else{const y=$('youtube').value.trim();if(!/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(y))throw Error('Introduza um link válido do YouTube.');payload={title,description:$('description').value.trim(),youtube_url:y,thumbnail_url:image,sort_order:Number($('sort').value)||0,is_published:$('published').value==='true'}}const id=$('itemId').value;await request('/rest/v1/'+(section==='news'?'news':'portfolio_items')+(id?'?id=eq.'+encodeURIComponent(id):''),{method:id?'PATCH':'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});$('formStatus').textContent='Conteúdo guardado com sucesso.';$('editor').classList.add('hidden');await loadItems()}catch(err){$('formStatus').textContent=err.message}}
async function deleteItem(item){if(!confirm('Eliminar “'+item.title+'”? Esta operação não pode ser desfeita.'))return;try{await request('/rest/v1/'+(section==='news'?'news':'portfolio_items')+'?id=eq.'+encodeURIComponent(item.id),{method:'DELETE'});await loadItems()}catch(e){alert(e.message)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').textContent='A autenticar…';try{await login($('email').value.trim(),$('password').value)}catch(err){$('loginStatus').textContent=err.message}});
$('logout').onclick=async()=>{try{await fetch(API+'/auth/v1/logout',{method:'POST',headers:headers()})}catch{}session=null;localStorage.removeItem('eden_cms_session');location.reload()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{section=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('editor').classList.add('hidden');setMode();await loadItems()});
$('newItem').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').classList.add('hidden');$('contentForm').addEventListener('submit',save);restore();
})();
</script></body></html>
